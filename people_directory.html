<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>People Directory</title>
<style>
:root{--ink:#302027;--muted:#786b72;--accent:#90334f;--bg:#fffaf6;--line:#eadfe1}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font:15px/1.5 Arial,sans-serif;color:var(--ink)}button,a,summary,input{touch-action:manipulation}button{font:inherit;cursor:pointer}.header{background:#302027;color:white;padding:28px max(20px,5vw)}.header h1{font:700 clamp(32px,5vw,54px)/1.1 Georgia,serif;margin:0 0 8px}.header p{margin:0;color:#e7dce0}.directory{display:grid;grid-template-columns:240px minmax(0,1fr);gap:25px;padding:25px max(18px,5vw);align-items:start}.filters{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}.filters h2{font-size:19px;margin:0 0 12px}.reset{width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:10px}details{border-top:1px solid var(--line)}summary{cursor:pointer;font-weight:bold;padding:14px 2px}.options{display:grid;gap:12px;padding:0 0 16px}.options label{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px}.options input{accent-color:var(--accent);width:17px;height:17px}.results{font-weight:700;margin:0 0 15px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden;text-align:left;padding:0;color:inherit;width:100%;transition:box-shadow .2s,transform .2s}.card:hover,.card:focus-visible{box-shadow:0 8px 24px #30202720;transform:translateY(-2px)}.card img{display:block;width:100%;height:200px;object-fit:cover;background:#f1e8e9}.card-content{padding:14px}.card h3{margin:0 0 6px;font-size:17px}.card p{margin:4px 0;font-size:13px;color:var(--muted)}.tag{display:inline-block;background:#f7e6ec;color:#85314b;border-radius:20px;padding:4px 9px;font-size:12px;margin-top:8px}.detail{padding:25px max(18px,5vw) 55px;max-width:1450px;margin:auto}.back{border:0;background:transparent;color:var(--muted);font-weight:700;padding:8px 0 24px}.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:50px;align-items:start}.detail-photo{width:100%;max-height:700px;object-fit:cover;border-radius:18px;background:#eee}.detail-info h2{font:700 clamp(34px,4vw,60px)/1.1 Georgia,serif;margin:12px 0}.detail-info .location{font-size:19px}.detail-info h3{border-top:1px solid var(--line);padding-top:22px;margin-top:28px}.detail-info p{color:var(--muted)}.contact{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;border:0;border-radius:30px;padding:13px 24px;margin-top:18px;font-weight:bold}.contact[hidden]{display:none}.note{font-size:12px}.empty{grid-column:1/-1;padding:40px 12px;text-align:center;color:var(--muted)}[hidden]{display:none!important}@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.directory{grid-template-columns:205px minmax(0,1fr);gap:14px}.detail-layout{gap:25px}}@media(max-width:600px){.directory,.detail-layout{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card img{height:150px}.detail-photo{max-height:450px}.detail-info h2{margin-top:4px}.header{padding:24px 18px}}
</style>
</head>
<body>
<header class="header"><h1>People Directory</h1><p>Explore profiles and choose someone to learn more about.</p></header>
<section id="directory-view" class="directory">
<aside class="filters"><h2>Filter Profiles</h2><button id="reset" class="reset" type="button">Clear all filters</button><details open><summary>Country</summary><div class="options" id="country-options"></div></details><details><summary>Age</summary><div class="options" id="age-options"></div></details><details><summary>Gender</summary><div class="options" id="gender-options"></div></details></aside>
<main><p id="count" class="results" aria-live="polite"></p><div class="cards" id="cards"></div></main>
</section>
<section id="detail-view" class="detail" hidden><button class="back" id="back" type="button">← Back to profiles</button><div class="detail-layout"><img class="detail-photo" id="detail-photo" alt=""><div class="detail-info"><h2 id="detail-name"></h2><div class="location" id="detail-location"></div><p id="detail-age"></p><a id="contact" class="contact" hidden>Contact</a><h3>Details</h3><p id="detail-gender"></p><p id="detail-description"></p><p class="note">Contact is available only when an email address has been provided for the profile.</p></div></div></section>
<script>
// Add your own profiles here. Only publish photos and personal information with permission.
const profiles=[
 {id:'alex',name:'Alex Morgan',age:24,gender:['Men'],country:'Philippines',city:'Manila',description:'Enjoys music, traveling, and exploring new places.',photo:'https://i.pravatar.cc/400?img=12',email:''},
 {id:'jordan',name:'Jordan Lee',age:29,gender:['Women'],country:'United States',city:'New York',description:'Interested in travel and photography.',photo:'https://i.pravatar.cc/400?img=13',email:''},
 {id:'sam',name:'Sam Taylor',age:32,gender:['Gay','Men'],country:'United Kingdom',city:'London',description:'Loves art, music, and creativity.',photo:'https://i.pravatar.cc/400?img=14',email:''},
 {id:'jamie',name:'Jamie Cruz',age:27,gender:['Lesbian','Women'],country:'Philippines',city:'Cebu',description:'Enjoys traveling and outdoor activities.',photo:'https://i.pravatar.cc/400?img=15',email:''},
 {id:'riley',name:'Riley Chen',age:35,gender:['Transgender','Women'],country:'Singapore',city:'Singapore',description:'Passionate about technology and design.',photo:'https://i.pravatar.cc/400?img=16',email:''},
 {id:'casey',name:'Casey Santos',age:22,gender:['Bisexual','Women'],country:'United States',city:'Los Angeles',description:'Enjoys nature and meeting new people.',photo:'https://i.pravatar.cc/400?img=17',email:''},
 {id:'mark',name:'Mark Denver D. Iro',age:25,gender:['Bisexual'],country:'Philippines',city:'Davao City',description:'i love youuu',photo:'https://drive.google.com/thumbnail?id=13vSnaEi9Rhf9Pw9Uli8nQ666a52sBO4_&sz=w1000',email:''}
];
const groups={country:[...new Set(profiles.map(p=>p.country))].sort(),age:['18–24','25–29','30–39','40+'],gender:['Men','Women','Gay','Lesbian','Bisexual','Transgender','Other']};
for(const [group,values] of Object.entries(groups)){
 const root=document.getElementById(group+'-options');
 for(const value of values){const label=document.createElement('label'),input=document.createElement('input'),span=document.createElement('span');input.type='checkbox';input.dataset.group=group;input.value=value;input.addEventListener('change',renderProfiles);span.textContent=value;label.append(input,span);root.append(label)}
}
function chosen(group){return [...document.querySelectorAll('input[data-group="'+group+'"]:checked')].map(x=>x.value)}
function ageMatch(age,range){return range==='18–24'?age>=18&&age<=24:range==='25–29'?age>=25&&age<=29:range==='30–39'?age>=30&&age<=39:age>=40}
function renderProfiles(){const countries=chosen('country'),ages=chosen('age'),genders=chosen('gender');const filtered=profiles.filter(p=>(!countries.length||countries.includes(p.country))&&(!ages.length||ages.some(a=>ageMatch(p.age,a)))&&(!genders.length||genders.some(g=>p.gender.includes(g))));document.getElementById('count').textContent=filtered.length+' profile'+(filtered.length===1?'':'s')+' found';const cards=document.getElementById('cards');cards.replaceChildren();if(!filtered.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No profiles match your selected filters.';cards.append(empty)}for(const p of filtered){const card=document.createElement('button');card.className='card';card.type='button';const img=document.createElement('img');img.src=p.photo;img.alt='Profile photo of '+p.name;img.loading='lazy';const body=document.createElement('div');body.className='card-content';const name=document.createElement('h3');name.textContent=p.name+', '+p.age;const location=document.createElement('p');location.textContent=p.city+', '+p.country;const tag=document.createElement('span');tag.className='tag';tag.textContent=p.gender.join(' · ');body.append(name,location,tag);card.append(img,body);card.addEventListener('click',()=>openProfile(p.id));cards.append(card)}}
function openProfile(id){const p=profiles.find(x=>x.id===id);if(!p)return;document.getElementById('detail-photo').src=p.photo;document.getElementById('detail-photo').alt='Profile photo of '+p.name;document.getElementById('detail-name').textContent=p.name;document.getElementById('detail-location').textContent=p.city+', '+p.country;document.getElementById('detail-age').textContent='Age: '+p.age;document.getElementById('detail-gender').textContent='Gender / identity: '+p.gender.join(' · ');document.getElementById('detail-description').textContent=p.description||'No description yet.';const contact=document.getElementById('contact');contact.hidden=!p.email;contact.href=p.email?'mailto:'+encodeURIComponent(p.email)+'?subject='+encodeURIComponent('Profile inquiry: '+p.name):'#';document.getElementById('directory-view').hidden=true;document.getElementById('detail-view').hidden=false;history.replaceState(null,'','#profile='+encodeURIComponent(id));window.scrollTo(0,0)}
function showDirectory(){document.getElementById('detail-view').hidden=true;document.getElementById('directory-view').hidden=false;history.replaceState(null,'',location.pathname+location.search);window.scrollTo(0,0)}
document.getElementById('back').addEventListener('click',showDirectory);document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('input[type="checkbox"]').forEach(x=>x.checked=false);renderProfiles()});renderProfiles();const requested=new URLSearchParams(location.hash.slice(1)).get('profile');if(requested)openProfile(requested);
</script>
</body>
</html>
